# Builds the RepCoun Android APK in the cloud (free for public repos).
# The APK appears under Actions → workflow run → Artifacts → RepCoun-APK.

name: Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      - name: Surface Gradle errors
        if: failure()
        run: |
          {
            echo '### Gradle failure'
            echo '#### Kotlin compiler errors'
            echo '```'
            grep -E '^e: ' gradle.log | head -40 || echo '(none found)'
            echo '```'
            echo '#### What went wrong'
            echo '```'
            grep -A 25 'What went wrong' gradle.log 2>/dev/null | head -40 || tail -n 60 gradle.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          KERR=$(grep -E '^e: ' gradle.log | head -20 | sed 's/$/%0A/' | tr -d '\n')
          if [ -z "$KERR" ]; then KERR=$( (grep -A 20 'What went wrong' gradle.log 2>/dev/null || tail -n 40 gradle.log) | head -40 | sed 's/$/%0A/' | tr -d '\n'); fi
          echo "::error title=Gradle build failed::${KERR}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepCoun-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
