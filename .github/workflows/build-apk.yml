# Builds the RepCoun Android APK in the cloud (free for public repos).
# The APK appears under Actions → workflow run → Artifacts → RepCoun-APK.

name: Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # publish the APK as a public release asset

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          # Firebase config comes from repository secrets — never committed.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -PciBuild=${{ github.run_number }} 2>&1 | tee ../gradle.log

      - name: Surface Gradle errors
        if: failure()
        run: |
          {
            echo '### Gradle failure'
            echo '#### Kotlin compiler errors'
            echo '```'
            grep -E '^e: ' gradle.log | head -40 || echo '(none found)'
            echo '```'
            echo '#### What went wrong'
            echo '```'
            grep -A 25 'What went wrong' gradle.log 2>/dev/null | head -40 || tail -n 60 gradle.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          KERR=$(grep -E '^e: ' gradle.log | head -20 | sed 's/$/%0A/' | tr -d '\n')
          if [ -z "$KERR" ]; then KERR=$( (grep -A 20 'What went wrong' gradle.log 2>/dev/null || tail -n 40 gradle.log) | head -40 | sed 's/$/%0A/' | tr -d '\n'); fi
          echo "::error title=Gradle build failed::${KERR}"

      - name: Name the APKs
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/RepCoun.apk
          mv android/wear/build/outputs/apk/debug/wear-debug.apk android/wear/build/outputs/apk/debug/RepCoun-Wear.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RepCoun-APK
          path: |
            android/app/build/outputs/apk/debug/RepCoun.apk
            android/wear/build/outputs/apk/debug/RepCoun-Wear.apk
          if-no-files-found: error
          retention-days: 30

      # Public download link (no GitHub account needed) — can be opened on any
      # phone and shared in WhatsApp etc.
      - name: Publish public APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RepCoun 1.0.0+b${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/debug/RepCoun.apk
            android/wear/build/outputs/apk/debug/RepCoun-Wear.apk
          body: |
            RepCoun **1.0.0+b${{ github.run_number }}** (build ${{ github.run_number }}).

            **Install (phone):** first UNINSTALL the old RepCoun, then open this APK file to install.
            The build number is shown at the bottom of the register/onboarding screen and in Profile → About.

            **Wear OS watch (RepCoun-Wear.apk):** sideload with ADB —
            watch: Settings → Developer options → ADB debugging + Debug over Wi-Fi, then
            `adb connect <watch-ip>:5555` and `adb install RepCoun-Wear.apk`.
            Open RepCoun on the watch while signed in on the phone — they pair by themselves.
