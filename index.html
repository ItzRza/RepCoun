<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="RepCoun — Effortlessly track reps. AI rep counter with offline pose tracking, calories and Health Connect." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="RepCoun" />
    <title>RepCoun — AI Rep Counter</title>
    <script>
      // Apply theme before first paint (no flash)
      try {
        var s = JSON.parse(localStorage.getItem("repcoun:settings") || "{}");
        if (s.theme === "dark" || (!s.theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
        if (s.themeStyle === "stylr") document.documentElement.setAttribute("data-style", "stylr");
        if (s.lang) document.documentElement.setAttribute("lang", s.lang);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
